name: Snes9x TX Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Snes9x TX
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["Wii", "GameCube"]
    # same devkitPPC as the official Snes9x TX 1.1.3 release (January 2023)
    container: devkitpro/devkitppc:20230110
 
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build Wii
      if: ${{ matrix.image == 'Wii' }}
      shell: bash
      run: |
        set -o pipefail
        if ! make -k -f Makefile.wii -j2 2>&1 | tee build.log; then
          msg=$(grep -E -B1 "error:|Error [0-9]|undefined reference|cannot find|No such file|not found" build.log | grep -v "^--$" | awk '!seen[$0]++' | head -n 150 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Wii build failed::$msg"
          exit 1
        fi
    
    # Exception screens show code addresses. List them (SRR0 and the stack
    # dump) in crash-addresses.txt and this step names the functions.
    - name: Resolve crash addresses
      if: ${{ matrix.image == 'Wii' && hashFiles('crash-addresses.txt') != '' }}
      shell: bash
      run: |
        out=$($DEVKITPPC/bin/powerpc-eabi-addr2line -f -C -i -p -e executables/snes9xtx-wii.elf $(grep -v "^#" crash-addresses.txt | tr -s " ,\n" " ") 2>&1 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::notice title=Crash addresses::$out"

    - name: Copy Wii artifact
      if: ${{ matrix.image == 'Wii' }}
      run: | 
        mkdir -p dist/Snes9xTX/apps/snes9xtx
        mkdir -p dist/Snes9xTX/snes9xtx/roms
        mkdir dist/Snes9xTX/snes9xtx/cheats
        mkdir dist/Snes9xTX/snes9xtx/saves
        touch dist/Snes9xTX/snes9xtx/roms/romsdir
        touch dist/Snes9xTX/snes9xtx/cheats/cheatsdir
        touch dist/Snes9xTX/snes9xtx/saves/savesdir
        cp hbc/* dist/Snes9xTX/apps/snes9xtx/
        cp executables/snes9xtx-wii.dol dist/Snes9xTX/apps/snes9xtx/boot.dol

    - name: Upload Wii artifacts
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'Wii' }}
      with: 
        name: Snes9xTX
        path: |
         dist/Snes9xTX/
    
    - name: Build GameCube
      if: ${{ matrix.image == 'GameCube' }}
      shell: bash
      run: |
        set -o pipefail
        if ! make -k -f Makefile.gc -j2 2>&1 | tee build.log; then
          msg=$(grep -E -B1 "error:|Error [0-9]|undefined reference|cannot find|No such file|not found" build.log | grep -v "^--$" | awk '!seen[$0]++' | head -n 150 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=GameCube build failed::$msg"
          exit 1
        fi
        
    - name: Copy GameCube artifact
      if: ${{ matrix.image == 'GameCube' }}
      run: | 
        mkdir -p dist/Snes9xTX-GameCube
        cp executables/snes9xtx-gc.dol dist/Snes9xTX-GameCube/
    
    - name: Upload GameCube artifact
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'GameCube' }}
      with: 
        name: Snes9xTX-GameCube
        path: |
         dist/Snes9xTX-GameCube/
